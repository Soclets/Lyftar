# trace: D49, D50, D51
# Builds static LLVM and lld for each host, with the optional parts that need other shared libraries turned off, and the system files
# each target needs to link, and publishes them on this repository's releases with their hashes. `build.rs` downloads the ones for its
# host and checks them against the hashes committed in it. Run it by hand for each LLVM release (Actions, "static LLVM", Run
# workflow); the owner gave a standing yes. Publishing adds what a release lacks and never replaces a file, since `build.rs` holds
# the hashes of the ones there.
name: static LLVM

on:
  workflow_dispatch:
    inputs:
      version:
        description: LLVM version, such as 23.1.2
        required: true
      system_only:
        description: Only the system files, for a release that has its LLVM already
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.system_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: aarch64-apple-darwin
            runner: macos-15
          - host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
      NAME: lyftar-llvm-${{ inputs.version }}-${{ matrix.host }}
    steps:
      - name: Tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Source
        run: |
          curl -fsSL -o source.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${VERSION}/llvm-project-${VERSION}.src.tar.xz"
          tar -xf source.tar.xz
          mv "llvm-project-${VERSION}.src" source
      # What Lyftar needs, and the tools its tests read objects with. Everything that would need another shared library is off.
      - name: Configure
        run: |
          cmake -G Ninja -S source/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/$NAME" \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_HTTPLIB=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INSTALL_UTILS=OFF \
            -DLLVM_DISTRIBUTION_COMPONENTS="llvm-libraries;llvm-headers;llvm-config;cmake-exports;lld-headers;lldCommon;lldELF;lldMachO;lldCOFF;lldWasm;lldMinGW;lld;opt;llc;llvm-readobj;llvm-objdump;llvm-ar"
      - name: Build
        run: ninja -C build install-distribution
      # LLVM only builds the C APIs of `lto.h` and `Remarks.h` as shared libraries, so these are compiled as static ones here.
      - name: Static libLTO and libRemarks
        run: |
          flags="$("$NAME/bin/llvm-config" --cxxflags)"
          mkdir objects
          c++ $flags -c source/llvm/tools/lto/lto.cpp -o objects/lto.o
          c++ $flags -c source/llvm/tools/lto/LTODisassembler.cpp -o objects/LTODisassembler.o
          c++ $flags -c source/llvm/tools/remarks-shlib/libremarks.cpp -o objects/libremarks.o
          "$NAME/bin/llvm-ar" rcs "$NAME/lib/libLTO.a" objects/lto.o objects/LTODisassembler.o
          "$NAME/bin/llvm-ar" rcs "$NAME/lib/libRemarks.a" objects/libremarks.o
          # The shared ones `llvm-libraries` installed would be found first, so a compiler would need them beside it.
          rm -f "$NAME"/lib/libLTO.*dylib "$NAME"/lib/libRemarks.*dylib "$NAME"/lib/libLTO.so* "$NAME"/lib/libRemarks.so*
      - name: Licences
        run: |
          cp source/llvm/LICENSE.TXT "$NAME/LICENSE-LLVM.txt"
          cp source/lld/LICENSE.TXT "$NAME/LICENSE-lld.txt"
      - name: Package
        run: |
          tar -cJf "$NAME.tar.xz" "$NAME"
          if [ "$RUNNER_OS" = macOS ]; then shasum -a 256 "$NAME.tar.xz"; else sha256sum "$NAME.tar.xz"; fi > "$NAME.tar.xz.sha256"
          cat "$NAME.tar.xz.sha256"
          ls -la "$NAME.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.xz
            ${{ env.NAME }}.tar.xz.sha256

  # trace: D51
  # What each target needs to link, with no SDK or libc installed: static musl and compiler-rt's builtins for Linux, and the builtins
  # alone for bare metal. Built with the Clang of the same LLVM version.
  system:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      MUSL: 1.2.5
      MUSL_SHA256: a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4
      NAME: lyftar-system-${{ inputs.version }}
    steps:
      - name: Tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh "${VERSION%%.*}"
          sudo apt-get install -y ninja-build
          major="${VERSION%%.*}"
          echo "CLANG=clang-$major" >> "$GITHUB_ENV"
          echo "AR=llvm-ar-$major" >> "$GITHUB_ENV"
          echo "RANLIB=llvm-ranlib-$major" >> "$GITHUB_ENV"
      - name: Source
        run: |
          curl -fsSL -o source.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${VERSION}/llvm-project-${VERSION}.src.tar.xz"
          tar -xf source.tar.xz
          mv "llvm-project-${VERSION}.src" source
          curl -fsSL -o musl.tar.gz "https://musl.libc.org/releases/musl-${MUSL}.tar.gz"
          echo "${MUSL_SHA256}  musl.tar.gz" | sha256sum --check
          tar -xzf musl.tar.gz
      - name: musl
        run: |
          for architecture in aarch64 x86_64; do
            rm -rf build-musl && cp -R "musl-${MUSL}" build-musl
            (cd build-musl && CC="$CLANG --target=${architecture}-linux-musl" AR="$AR" RANLIB="$RANLIB" \
              ./configure --target="${architecture}-linux-musl" --prefix="$PWD/../musl-${architecture}" --disable-shared \
              && make -j4 && make install)
            mkdir -p "$NAME/linux-${architecture}"
            cp "musl-${architecture}"/lib/{crt1.o,rcrt1.o,Scrt1.o,crti.o,crtn.o,libc.a} "$NAME/linux-${architecture}/"
          done
      - name: Builtins
        run: |
          builtins() {
            directory="$1"; triple="$2"; system="$3"; flags="$4"; sysroot="$5"
            cmake -G Ninja -S source/compiler-rt/lib/builtins -B "builtins-$directory" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$CLANG" -DCMAKE_ASM_COMPILER="$CLANG" -DCMAKE_AR="$(command -v "$AR")" \
              -DCMAKE_RANLIB="$(command -v "$RANLIB")" -DCMAKE_SYSTEM_NAME="$system" \
              -DCMAKE_C_COMPILER_TARGET="$triple" -DCMAKE_ASM_COMPILER_TARGET="$triple" \
              -DCMAKE_C_FLAGS="$flags $sysroot" -DCMAKE_ASM_FLAGS="$flags" -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON -DCOMPILER_RT_BAREMETAL_BUILD=ON -DCOMPILER_RT_OS_DIR=lyftar \
              -DLLVM_CONFIG_PATH="$(command -v "llvm-config-${VERSION%%.*}")"
            ninja -C "builtins-$directory"
            mkdir -p "$NAME/$directory"
            cp "$(find "builtins-$directory" -name 'libclang_rt.builtins*.a' | head -1)" "$NAME/$directory/libclang_rt.builtins.a"
          }
          builtins linux-aarch64 aarch64-linux-musl Linux "" "--sysroot=$PWD/musl-aarch64"
          builtins linux-x86_64 x86_64-linux-musl Linux "" "--sysroot=$PWD/musl-x86_64"
          builtins cortex-m4 thumbv7em-none-eabihf Generic "-mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16 -ffreestanding" ""
      - name: Licences
        run: |
          cp "musl-${MUSL}/COPYRIGHT" "$NAME/LICENSE-musl.txt"
          cp source/compiler-rt/LICENSE.TXT "$NAME/LICENSE-compiler-rt.txt"
      - name: Package
        run: |
          tar -cJf "$NAME.tar.xz" "$NAME"
          sha256sum "$NAME.tar.xz" > "$NAME.tar.xz.sha256"
          cat "$NAME.tar.xz.sha256"
          ls -la "$NAME.tar.xz"
          find "$NAME" -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.xz
            ${{ env.NAME }}.tar.xz.sha256

  publish:
    needs: [build, system]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="llvm-${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Static LLVM and lld ${VERSION}" \
              --notes "Static LLVM and lld ${VERSION} for each host, and the system files each target needs, for build.rs to download (D50, D51). Built by .github/workflows/llvm.yml."
          fi
          there="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for file in files/*; do
            if printf '%s\n' "$there" | grep -qxF "$(basename "$file")"; then
              echo "already published, left as it is: $(basename "$file")"
            else
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
