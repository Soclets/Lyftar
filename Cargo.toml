[package]
name = "lyftar"
# trace: D19
version = "0.1.0"
edition = "2024"
description = "Build LLVM IR and write LLVM passes in safe Rust, for the latest stable LLVM"
# trace: D17
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Soclets/Lyftar"
build = "build.rs"
exclude = ["tools/bindings/target"]

[lints.rust]
# Verus sets this cfg when it reads the proven checks (D22); plain rustc never does.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[build-dependencies]
cc = "1"

[dev-dependencies]
# trace: D46
lyftar-stack-maps = { path = "stack-maps" }
serde_json = "1"
trybuild = "1"

# D14: macOS uses the committed bindings; every other platform generates them.
[target.'cfg(not(target_os = "macos"))'.build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }

[workspace]
# trace: D46
members = ["stack-maps", "tests/collector"]
exclude = ["tools/bindings"]

# kayo's two passes in Rust, as one plugin for `opt` and `clang`.
[[example]]
name = "kayo_passes_plugin"
crate-type = ["cdylib"]

# D24: what Lyftar adds over raw LLVM calls.
[[bench]]
name = "overhead"
harness = false
